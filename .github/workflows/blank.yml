              <div className="flex items-center space-x-4">
                <a href="tel:0570664167" className="text-slate-300 hover:text-amber-400 flex items-center gap-1.5 font-semibold">
                  <i className="fas fa-phone text-amber-500"></i> 0570664167
                </a>
                <a href="mailto:wsenkaali@gmail.com" className="text-slate-300 hover:text-amber-400 flex items-center gap-1.5 font-semibold">
                  <i className="fas fa-envelope text-amber-500"></i> wsenkaali@gmail.com
                </a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
