                    </div>

                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                      <span className="font-bold text-slate-400 uppercase text-[10px] block mb-2">CONSIGNEE / RECEIVER</span>
                      <p className="font-bold text-sm text-slate-900">{selectedWaybill.receiver_name}</p>
                      <p className="text-slate-600">{selectedWaybill.receiver_phone}</p>
                      <p className="text-slate-600">{selectedWaybill.receiver_city}, {selectedWaybill.receiver_country}</p>
                    </div>
                  </div>

                  <div className="border border-slate-200 rounded-xl overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-100 font-bold uppercase text-slate-700">
                        <tr>
                          <th className="p-3">Service Mode</th>
                          <th className="p-3">Cargo Type</th>
                          <th className="p-3">Weight</th>
                          <th className="p-3">Volume</th>
                          <th className="p-3 text-right">Total Charge</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 font-mono">
                        <tr>
                          <td className="p-3">{selectedWaybill.service_type || 'Sea Freight'}</td>
                          <td className="p-3">{selectedWaybill.cargo_type}</td>
                          <td className="p-3">{selectedWaybill.weight_kg} kg</td>
                          <td className="p-3">{selectedWaybill.volume_cbm} CBM</td>
                          <td className="p-3 text-right font-bold text-slate-900">{selectedWaybill.total_cost_sar} SAR</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <div className="pt-8 grid grid-cols-2 gap-8 text-xs">
                    <div>
                      <p className="font-bold text-slate-700 mb-8">Shipper Signature & Stamp:</p>
                      <div className="border-b border-slate-400 w-full"></div>
                    </div>
                    <div>
                      <p className="font-bold text-slate-700 mb-8">Receiving Agent Signature:</p>
                      <div className="border-b border-slate-400 w-full"></div>
                    </div>
                  </div>

                </div>

              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="bg-slate-900 border-t border-slate-800 py-8 no-print mt-12">
            <div className="max-w-7xl mx-auto px-4 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-slate-500">
              <div>
                <p className="font-bold text-slate-300">Nyago Cargo & Logistics</p>
                <p className="mt-0.5">Jeddah Islamic Port - Al-Khumrah Staging Hub, KSA</p>
                <p className="mt-0.5 text-amber-400 font-medium">Phone: 0570664167 | Email: wsenkaali@gmail.com</p>
