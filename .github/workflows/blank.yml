<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SUPABASE INITIALIZATION WITH YOUR PROVIDED KEYS ---
    const SUPABASE_URL = 'https://zmrmhwvwtqwegojumgcm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_by27usgXiFRbR8qPe6ldxg_1LJkx44q';
    
    let supabase = null;
    try {
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      console.warn("Supabase client init issue:", err);
    }

    // Tariff Rates Matrix (SAR values)
    const RATES = {
      Uganda: { seaCbm: 1100, airKg: 32, airMinKg: 10, estSeaDays: '28-35', estAirDays: '4-7' },
      Kenya: { seaCbm: 850, airKg: 28, airMinKg: 10, estSeaDays: '20-25', estAirDays: '3-5' },
      Tanzania: { seaCbm: 950, airKg: 30, airMinKg: 10, estSeaDays: '22-28', estAirDays: '4-6' },
      Rwanda: { seaCbm: 1250, airKg: 36, airMinKg: 10, estSeaDays: '32-40', estAirDays: '5-8' }
    };

    function App() {
      const [currentView, setCurrentView] = useState('track'); // track, book, my-bookings, calculator, waybill
      const [trackingInput, setTrackingInput] = useState('');
      const [activeShipment, setActiveShipment] = useState(null);
      const [trackingLoading, setTrackingLoading] = useState(false);
      const [trackingError, setTrackingError] = useState('');
      const [myBookings, setMyBookings] = useState([]);
      const [bookingsLoading, setBookingsLoading] = useState(false);
      const [selectedWaybill, setSelectedWaybill] = useState(null);
      
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Calculator state
      const [calcData, setCalcData] = useState({
        origin: 'Jeddah',
        destination: 'Uganda',
        mode: 'sea',
        weight: '50',
        length: '100',
        width: '50',
        height: '50',
      });

      // Booking state
      const [bookingForm, setBookingForm] = useState({
        senderName: '',
        senderPhone: '+966 ',
        senderCity: 'Jeddah',
        receiverName: '',
        receiverPhone: '+256 ',
        receiverCountry: 'Uganda',
        receiverCity: 'Kampala',
        serviceType: 'Sea Freight',
        cargoType: 'Personal Effects',
        weightKg: '30',
        volumeCbm: '0.25',
        declaredValue: '1000',
        notes: '',
      });
      const [isSubmitting, setIsSubmitting] = useState(false);

      // Auto calculate cost for booking form
      const calculatedBookingCost = useMemo(() => {
        const country = RATES[bookingForm.receiverCountry] || RATES.Uganda;
        const weight = parseFloat(bookingForm.weightKg) || 0;
        const cbm = parseFloat(bookingForm.volumeCbm) || 0;

        if (bookingForm.serviceType === 'Air Freight') {
          return Math.max(weight * country.airKg, country.airMinKg * country.airKg);
        } else {
          return Math.max(cbm * country.seaCbm, country.seaCbm * 0.1);
        }
      }, [bookingForm]);

      // Calculate rates for tariff calculator view
      const calculatedEstimate = useMemo(() => {
        const country = RATES[calcData.destination] || RATES.Uganda;
        const l = parseFloat(calcData.length) || 0;
        const w = parseFloat(calcData.width) || 0;
        const h = parseFloat(calcData.height) || 0;
        const weight = parseFloat(calcData.weight) || 0;

        const volumeCbm = (l * w * h) / 1000000;
        let totalCost = 0;

        if (calcData.mode === 'sea') {
          totalCost = Math.max(volumeCbm * country.seaCbm, country.seaCbm * 0.1);
        } else {
          totalCost = Math.max(weight * country.airKg, country.airMinKg * country.airKg);
        }

        return {
          cbm: volumeCbm.toFixed(3),
          costSAR: Math.round(totalCost),
          costUSD: Math.round(totalCost / 3.75),
          deliveryDays: calcData.mode === 'sea' ? country.estSeaDays : country.estAirDays
        };
      }, [calcData]);

      // Query database for all bookings
      const fetchMyBookings = async () => {
        if (!supabase) return;
        setBookingsLoading(true);
        try {
          const { data, error } = await supabase
            .from('shipments')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) throw error;
          setMyBookings(data || []);
        } catch (err) {
          console.error("Error fetching shipments from Supabase:", err.message);
          showToast('Failed to fetch shipments from Supabase database.', 'error');
        } finally {
          setBookingsLoading(false);
        }
      };

      useEffect(() => {
        if (currentView === 'my-bookings') {
          fetchMyBookings();
        }
      }, [currentView]);

      // Live Tracking Lookup Function
      const handleSearchTracking = async (codeToSearch) => {
        const code = (codeToSearch || trackingInput).trim().toUpperCase();
        if (!code) {
          showToast('Please enter a tracking number', 'error');
          return;
        }

        setTrackingLoading(true);
        setTrackingError('');
        setActiveShipment(null);

        try {
          if (supabase) {
            const { data, error } = await supabase
              .from('shipments')
              .select('*')
              .eq('tracking_id', code)
              .maybeSingle();

            if (error) throw error;

            if (data) {
              setActiveShipment(data);
              setCurrentView('track');
              setTrackingLoading(false);
              return;
            }
          }

          const localMatch = myBookings.find(b => b.tracking_id === code);
          if (localMatch) {
            setActiveShipment(localMatch);
            setCurrentView('track');
          } else {
            setTrackingError(`No active shipment record matching "${code}". Check tracking ID and retry.`);
          }
        } catch (err) {
          console.error("Tracking lookup error:", err.message);
          setTrackingError('Error connecting to Supabase database.');
        } finally {
          setTrackingLoading(false);
        }
      };

      // Submit new shipment booking to Supabase
      const handleBookingSubmit = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        const newTrackingCode = 'NYG-' + Math.floor(100000 + Math.random() * 900000);
        
        const payload = {
          tracking_id: newTrackingCode,
          sender_name: bookingForm.senderName,
          sender_phone: bookingForm.senderPhone,
          sender_city: bookingForm.senderCity,
          receiver_name: bookingForm.receiverName,
          receiver_phone: bookingForm.receiverPhone,
          receiver_country: bookingForm.receiverCountry,
          receiver_city: bookingForm.receiverCity,
          service_type: bookingForm.serviceType,
          cargo_type: bookingForm.cargoType,
          weight_kg: parseFloat(bookingForm.weightKg),
          volume_cbm: parseFloat(bookingForm.volumeCbm),
          total_cost_sar: calculatedBookingCost,
          current_status: 'Booking Confirmed - Staging at Origin Hub',
          created_at: new Date().toISOString()
        };

        try {
          if (supabase) {
            const { data, error } = await supabase
              .from('shipments')
              .insert([payload])
              .select();

            if (error) {
              console.error("Supabase insert error:", error);
              showToast(`Saved locally! Supabase note: ${error.message}`, "error");
            } else {
              showToast(`Shipment saved in Supabase! Tracking ID: ${newTrackingCode}`);
            }
          } else {
            showToast(`Shipment recorded! Tracking ID: ${newTrackingCode}`);
          }

          setMyBookings(prev => [payload, ...prev]);
          setActiveShipment(payload);
          setSelectedWaybill(payload);
          setCurrentView('waybill');

        } catch (err) {
          console.error("Submission failed:", err);
          showToast("Failed to complete booking.", "error");
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100">
          
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border transition-all ${
              toast.type === 'error' ? 'bg-rose-950 border-rose-800 text-rose-200' : 'bg-emerald-950 border-emerald-800 text-emerald-200'
            }`}>
              <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} text-lg`}></i>
              <span className="font-medium text-sm">{toast.message}</span>
            </div>
          )}

          {/* NAVIGATION BAR */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                
                {/* BRAND LOGO */}
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentView('track')}>
                  <div className="w-11 h-11 bg-gradient-to-tr from-amber-500 to-amber-600 rounded-xl flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20">
                    N
                  </div>
                  <div>
                    <span className="text-xl font-black tracking-tight text-white flex items-center gap-1.5">
                      NYAGO <span className="text-amber-500">CARGO</span>
                    </span>
                    <span className="block text-[10px] tracking-widest text-slate-400 font-semibold uppercase">
                      Saudi Arabia <i className="fas fa-arrow-right text-[8px] text-amber-500 mx-1"></i> East Africa
                    </span>
                  </div>
                </div>

                {/* DESKTOP NAV */}
                <nav className="hidden md:flex space-x-1 bg-slate-950/60 p-1.5 rounded-2xl border border-slate-800">
                  <button
                    onClick={() => setCurrentView('track')}
                    className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-2 ${
                      currentView === 'track' ? 'bg-amber-500 text-slate-950 shadow-md shadow-amber-500/10' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                    }`}
                  >
                    <i className="fas fa-location-dot"></i>
                    <span>Track Cargo</span>
                  </button>

                  <button
                    onClick={() => setCurrentView('book')}
                    className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-2 ${
                      currentView === 'book' ? 'bg-amber-500 text-slate-950 shadow-md shadow-amber-500/10' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                    }`}
                  >
                    <i className="fas fa-box-open"></i>
                    <span>Book Shipment</span>
                  </button>

                  <button
                    onClick={() => setCurrentView('my-bookings')}
                    className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-2 ${
                      currentView === 'my-bookings' ? 'bg-amber-500 text-slate-950 shadow-md shadow-amber-500/10' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                    }`}
                  >
                    <i className="fas fa-database"></i>
                    <span>Live DB Shipments</span>
                  </button>

                  <button
                    onClick={() => setCurrentView('calculator')}
                    className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-2 ${
                      currentView === 'calculator' ? 'bg-amber-500 text-slate-950 shadow-md shadow-amber-500/10' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                    }`}
                  >
                    <i className="fas fa-calculator"></i>
                    <span>CBM Calculator</span>
                  </button>
                </nav>

                {/* CONTACT DETAILS & STATUS */}
                <div className="hidden lg:flex items-center space-x-3">
                  <a href="tel:0570664167" className="px-3 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/20 text-[11px] font-semibold text-amber-400 flex items-center space-x-2 hover:bg-amber-500/20 transition-all">
                    <i className="fas fa-phone-flip text-xs"></i>
                    <span>0570664167</span>
                  </a>
                  <a href="mailto:wsenkaali@gmail.com" className="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-[11px] font-semibold text-slate-300 flex items-center space-x-2 hover:border-slate-700 transition-all">
                    <i className="fas fa-envelope text-amber-500 text-xs"></i>
                    <span>wsenkaali@gmail.com</span>
                  </a>
                </div>

              </div>
            </div>

            {/* MOBILE NAV BAR */}
            <div className="md:hidden flex justify-around bg-slate-900 border-t border-slate-800 py-2.5 px-2 text-xs">
              <button
                onClick={() => setCurrentView('track')}
                className={`flex flex-col items-center space-y-1 ${currentView === 'track' ? 'text-amber-500 font-bold' : 'text-slate-400'}`}
              >
                <i className="fas fa-location-dot text-base"></i>
                <span className="text-[10px]">Track</span>
              </button>
              <button
                onClick={() => setCurrentView('book')}
                className={`flex flex-col items-center space-y-1 ${currentView === 'book' ? 'text-amber-500 font-bold' : 'text-slate-400'}`}
              >
                <i className="fas fa-plus-circle text-base"></i>
                <span className="text-[10px]">Book</span>
              </button>
              <button
                onClick={() => setCurrentView('my-bookings')}
                className={`flex flex-col items-center space-y-1 ${currentView === 'my-bookings' ? 'text-amber-500 font-bold' : 'text-slate-400'}`}
              >
                <i className="fas fa-database text-base"></i>
                <span className="text-[10px]">Database</span>
              </button>
              <button
                onClick={() => setCurrentView('calculator')}
                className={`flex flex-col items-center space-y-1 ${currentView === 'calculator' ? 'text-amber-500 font-bold' : 'text-slate-400'}`}
              >
                <i className="fas fa-calculator text-base"></i>
                <span className="text-[10px]">CBM Rates</span>
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">

            {/* VIEW 1: REAL-TIME TRACKING */}
            {currentView === 'track' && (
              <div className="space-y-8">
                
                {/* HERO BANNER */}
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-slate-900 to-amber-950/30 border border-slate-800 p-8 md:p-12 text-center shadow-2xl">
                  <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-semibold mb-4">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Direct Door-to-Door Freight: Saudi Arabia to East Africa</span>
                  </div>

                  <h1 className="text-3xl sm:text-5xl font-black text-white tracking-tight max-w-3xl mx-auto leading-tight">
                    Track Your Shipment Live <span className="text-amber-500">Across Borders</span>
                  </h1>
                  
                  <p className="mt-3 text-slate-400 text-sm sm:text-base max-w-xl mx-auto">
                    Search by unique Tracking ID to fetch live status directly from your Supabase database.
                  </p>

                  {/* SEARCH BOX */}
                  <div className="mt-8 max-w-2xl mx-auto">
                    <form 
                      onSubmit={(e) => { e.preventDefault(); handleSearchTracking(); }}
                      className="flex flex-col sm:flex-row gap-2 bg-slate-950/80 p-2 rounded-2xl border border-slate-700/80 shadow-2xl"
                    >
                      <div className="relative flex-grow flex items-center">
                        <i className="fas fa-barcode text-slate-500 ml-4 text-lg"></i>
                        <input
                          type="text"
                          placeholder="Enter Tracking ID (e.g. NYG-849201)..."
                          value={trackingInput}
                          onChange={(e) => setTrackingInput(e.target.value)}
                          className="w-full bg-transparent px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none uppercase font-mono tracking-wider"
                        />
                      </div>
                      <button
                        type="submit"
                        disabled={trackingLoading}
                        className="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold px-8 py-3.5 rounded-xl text-sm transition-all flex items-center justify-center space-x-2 shadow-lg shadow-amber-500/20"
                      >
                        {trackingLoading ? (
                          <i className="fas fa-spinner fa-spin"></i>
                        ) : (
                          <>
                            <i className="fas fa-search"></i>
                            <span>Search DB</span>
                          </>
                        )}
                      </button>
                    </form>
                  </div>

                  {/* CONTACT QUICK ACCESS */}
                  <div className="mt-8 pt-6 border-t border-slate-800/80 flex flex-wrap justify-center gap-6 text-xs text-slate-300">
                    <a href="tel:0570664167" className="flex items-center space-x-2 hover:text-amber-400 transition-colors">
                      <div className="w-7 h-7 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center">
                        <i className="fas fa-phone text-xs"></i>
                      </div>
                      <span><strong>Support Phone:</strong> 0570664167</span>
                    </a>
                    <a href="mailto:wsenkaali@gmail.com" className="flex items-center space-x-2 hover:text-amber-400 transition-colors">
                      <div className="w-7 h-7 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center">
                        <i className="fas fa-envelope text-xs"></i>
                      </div>
                      <span><strong>Dispatch Email:</strong> wsenkaali@gmail.com</span>
                    </a>
                  </div>

                </div>

                {/* TRACKING RESULTS DISPLAY */}
                {trackingError && (
                  <div className="bg-rose-950/40 border border-rose-800/60 p-6 rounded-2xl text-center text-rose-300 text-sm">
                    <i className="fas fa-triangle-exclamation text-2xl mb-2 text-rose-400 block"></i>
                    {trackingError}
                  </div>
                )}

                {activeShipment && (
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-8 shadow-2xl">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-6 gap-4">
                      <div>
                        <span className="text-xs font-mono text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
                          {activeShipment.tracking_id}
                        </span>
                        <h2 className="text-2xl font-bold text-white mt-2">
                          {activeShipment.cargo_type} ({activeShipment.service_type || 'Sea Freight'})
                        </h2>
                        <p className="text-xs text-slate-400 mt-1">
                          Route: <span className="text-slate-200">{activeShipment.sender_city || 'Jeddah'}</span> → <span className="text-slate-200">{activeShipment.receiver_city}, {activeShipment.receiver_country}</span>
                        </p>
                      </div>

                      <div className="flex items-center space-x-3">
                        <button
                          onClick={() => { setSelectedWaybill(activeShipment); setCurrentView('waybill'); }}
                          className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/20 text-xs font-semibold rounded-xl flex items-center space-x-2 transition-all"
                        >
                          <i className="fas fa-file-invoice"></i>
                          <span>View Digital Waybill</span>
                        </button>
                      </div>
                    </div>

                    {/* STATUS TIMELINE */}
                    <div className="space-y-4">
                      <h3 className="text-sm font-bold text-slate-300 uppercase tracking-wider">Live Transit Milestones</h3>
                      <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-slate-950 p-4 rounded-2xl border border-emerald-500/30">
                          <i className="fas fa-box-check text-emerald-400 text-lg mb-2"></i>
                          <p className="text-xs font-bold text-slate-200">1. Staging Hub</p>
                          <p className="text-[11px] text-slate-400 mt-1">Cargo received & measured in Jeddah</p>
                        </div>
                        <div className="bg-slate-950 p-4 rounded-2xl border border-amber-500/30">
                          <i className="fas fa-ship text-amber-400 text-lg mb-2"></i>
                          <p className="text-xs font-bold text-slate-200">2. Port Dispatch</p>
                          <p className="text-[11px] text-slate-400 mt-1">Container vessel en route</p>
                        </div>
                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                          <i className="fas fa-warehouse text-slate-500 text-lg mb-2"></i>
                          <p className="text-xs font-bold text-slate-400">3. Port Customs</p>
                          <p className="text-[11px] text-slate-500 mt-1">Customs clearance at destination port</p>
                        </div>
                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                          <i className="fas fa-truck-ramp-box text-slate-500 text-lg mb-2"></i>
                          <p className="text-xs font-bold text-slate-400">4. Final Delivery</p>
