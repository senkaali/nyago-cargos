                    <div>
                      <h1 className="text-2xl font-black tracking-tight text-slate-900">NYAGO CARGO & LOGISTICS</h1>
                      <p className="text-xs text-slate-600 font-semibold">Jeddah Islamic Port • Al-Khumrah Staging Hub</p>
